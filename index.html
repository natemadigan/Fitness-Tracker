<style>
:root{
  --bg:#EEF1F6;--card:#FFFFFF;--soft:#F4F6FA;--ink:#161A2C;--ink2:#474E66;--muted:#737A90;--line:#E2E6EE;
  --day:#2F6BFF;--daysoft:#E7EEFF;
  --display:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --shadow:0 1px 2px rgba(22,26,44,.05),0 2px 8px rgba(22,26,44,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--day);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 104px)}
.view{display:none}.view.on{display:block}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 14px}
.top h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.05}
.top .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.icon-btn{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.icon-btn svg{width:20px;height:20px}

/* week strip */
.week{display:flex;align-items:center;gap:4px;margin:0 -4px 16px}
.wk-arrow{width:30px;height:52px;flex:none;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:12px}
.wk-arrow svg{width:16px;height:16px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day{border:0;background:transparent;border-radius:16px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);min-width:0}
.day .dn{font-size:11px;color:var(--muted);font-weight:500}
.day .dd{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.3}
.day.done .dot{opacity:1}
.day.today .dd{color:var(--c)}
.day.sel{background:var(--c);color:#fff}
.day.sel .dn{color:rgba(255,255,255,.85)}
.day.sel .dd{color:#fff}
.day.sel .dot{background:#fff;opacity:.55}
.day.sel.done .dot{opacity:1}
.wk-label{text-align:center;font-size:12.5px;color:var(--muted);margin:-8px 0 14px}
.wk-label button{border:0;background:none;color:var(--day);font-weight:600;font-size:12.5px;padding:2px 4px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--day);color:#fff;border-radius:28px;padding:16px 18px 18px;margin-bottom:8px}
.hero .topo{position:absolute;right:-30px;top:-10px;width:300px;height:220px;opacity:.16;pointer-events:none}
.hero-top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.chip svg{width:12px;height:12px}
.est{font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.hero h2{position:relative;font-family:var(--display);font-size:56px;line-height:.92;font-weight:800;letter-spacing:-.035em;margin:22px 0 8px}
.hero p{position:relative;margin:0;font-size:14.5px;opacity:.92;max-width:28ch}
.hero-row{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:20px}
.timer .t{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.timer .l{font-size:12.5px;opacity:.85;margin-top:4px}
.timer .btns{display:flex;gap:8px;margin-top:12px}
.hbtn{border:0;border-radius:999px;padding:10px 18px;font-weight:650;font-size:14px;background:#fff;color:var(--day)}
.hbtn.ghost{background:rgba(255,255,255,.2);color:#fff}
.tin{width:70px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.22);color:#fff;font-family:var(--display);font-size:24px;font-weight:600;text-align:center}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .rv b{display:block;font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.ring .rv span{font-size:10.5px;opacity:.85}

/* sections */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 4px 10px}
.sec h3{font-family:var(--display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.015em}
.sec span{font-size:13px;color:var(--muted)}
.grp{font-size:13px;font-weight:600;color:var(--muted);margin:16px 4px 8px}

/* exercise card */
.ex{background:var(--card);border-radius:18px;margin-bottom:8px;box-shadow:var(--shadow)}
.ex-h{display:flex;align-items:center;gap:12px;padding:14px;width:100%;border:0;background:none;text-align:left}
.status{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.status svg{width:13px;height:13px;opacity:0}
.ex.logged .status,.chk.on .status{background:var(--day);border-color:var(--day)}
.ex.logged .status svg,.chk.on .status svg{opacity:1}
.ex-t{flex:1;min-width:0}
.ex-name{font-weight:620;font-size:15.5px;line-height:1.25}
.ex-rx{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.ss{flex:none;font-size:12px;font-weight:700;color:var(--day);background:var(--daysoft);border-radius:8px;padding:4px 7px;font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .2s}
.ex.open .chev{transform:rotate(180deg)}
.ex-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.ex.open .ex-b{grid-template-rows:1fr}
.ex-b>div{overflow:hidden}
.ex-in{padding:0 14px 14px}
.note{font-size:13.5px;color:var(--ink2);background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink2)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sets{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px;align-items:center}
.sets .hd{font-size:12px;color:var(--muted);text-align:center}
.sets .n{font-family:var(--display);font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.in{height:46px;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--soft);text-align:center;font-size:16px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.in::placeholder{color:#A6ACBD}
.in:focus{outline:none;border-color:var(--day);background:#fff}
.sd{height:46px;width:46px;border-radius:12px;border:0;background:var(--soft);display:grid;place-items:center;color:#B5BACA}
.sd svg{width:18px;height:18px}
.sd.on{background:var(--day);color:#fff}
.last{margin:0 0 10px 2px;font-size:13px;color:var(--muted)}
.sr{grid-column:2/5;font-size:12.5px;color:var(--muted);margin:-3px 0 3px 4px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.sr:empty{display:none}
.prc,.prh{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.02em;color:#fff;background:#E8641B;border-radius:6px;padding:2px 6px}
.prh{flex:none}
.prh.off{display:none}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rb{height:54px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-family:var(--display);font-size:22px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.rb.on{background:var(--day);color:#fff}
.rate-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:6px 4px 0}
.last b{color:var(--ink);font-weight:600}

/* check rows */
.chk{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:0;border-radius:16px;padding:13px 14px;margin-bottom:8px;text-align:left;box-shadow:var(--shadow)}
.chk .ct{flex:1;min-width:0}
.chk .cn{font-weight:600;font-size:15px}
.chk .cd{font-size:13px;color:var(--muted);margin-top:1px}

/* cardio */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.cardio-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cardio-head h4{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.015em}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:4px 9px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.req{background:#E4F3EB;color:#16714A}
.target{font-family:var(--display);font-size:17px;font-weight:600;margin-top:6px}
.cdesc{font-size:13.5px;color:var(--ink2);margin:4px 0 14px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 2px}
.ivs{display:flex;gap:8px;margin-top:14px}
.iv{flex:1;height:44px;border-radius:12px;border:0;background:var(--soft);font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.iv.on{background:#1F8F5F;color:#fff}
.bigbtn{width:100%;height:50px;border:0;border-radius:14px;margin-top:14px;background:var(--ink);color:#fff;font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn svg{width:18px;height:18px}
.bigbtn.green{background:#1F8F5F}
.bigbtn.day{background:var(--day)}
.bigbtn.light{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* recovery */
.rec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec .chk{margin:0}

/* notes */
textarea.notes{width:100%;min-height:96px;border:0;border-radius:18px;padding:14px;background:var(--card);box-shadow:var(--shadow);font-size:15px;line-height:1.45;resize:vertical}
textarea.notes:focus{outline:2px solid var(--day)}
.prev-note{margin-top:10px;border-radius:16px;padding:12px 14px;background:transparent;border:1px dashed #CDD3DF;font-size:14px;color:var(--ink2)}
.prev-note .pl{font-size:12.5px;color:var(--muted);margin-bottom:4px}

.banner{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;margin:0 0 14px}
.banner .bt{flex:1;font-size:14px}
.banner button{border:0;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.banner .b1{background:rgba(255,255,255,.14);color:#fff}
.banner .b2{background:#fff;color:var(--ink)}

/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(22,26,44,.14);z-index:50}
.tab{border:0;background:none;border-radius:999px;padding:10px 16px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--muted)}
.tab svg{width:18px;height:18px}
.tab.on{background:var(--ink);color:#fff}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(22,26,44,.38);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;max-height:88vh;overflow:auto;transform:translate(-50%,100%);transition:transform .25s ease;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 24px);z-index:91}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:#CDD3DF;margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-size:24px;font-weight:700;margin:4px 2px 2px;letter-spacing:-.02em}
.sheet .sh-sub{color:var(--muted);font-size:13.5px;margin:0 2px 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:8px;text-align:left;box-shadow:var(--shadow)}
.opt .sw{width:12px;height:12px;border-radius:4px;flex:none}
.opt .ot{flex:1}
.opt .on1{font-weight:600}
.opt .od{font-size:13px;color:var(--muted)}
.opt.on{outline:2px solid var(--ink)}
.dateIn{height:48px;width:100%;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:16px;box-shadow:var(--shadow)}
.fine{font-size:12.5px;color:var(--muted);margin:14px 2px 0}
.detail-ex{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.detail-ex .dn2{font-weight:600}
.detail-ex .ds{font-size:13.5px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}

/* history */
.month{font-family:var(--display);font-size:18px;font-weight:700;margin:22px 4px 10px}
.hi{display:flex;gap:12px;width:100%;border:0;background:var(--card);border-radius:18px;padding:13px 14px;margin-bottom:8px;text-align:left;box-shadow:var(--shadow)}
.hi .bar{width:4px;border-radius:2px;background:var(--c);flex:none}
.hi .hb{flex:1;min-width:0}
.hi .hr1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hi .ht{font-weight:650}
.hi .hd{font-size:13px;color:var(--muted);white-space:nowrap}
.hi .hs{font-size:13px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.hi .hn{font-size:13px;color:var(--muted);margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{text-align:center;color:var(--muted);padding:40px 20px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile b small{font-size:15px;color:var(--muted);font-weight:600}
.tile span{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}
.timeline{display:flex;gap:3px;margin-top:14px}
.timeline i{flex:1;height:26px;border-radius:6px;background:var(--c)}
.timeline i.dl{background:repeating-linear-gradient(135deg,#C9CEDA 0 3px,#E8EBF1 3px 6px)}
.timeline i.now{outline:2px solid var(--ink);outline-offset:2px}
.tl-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend i.dl{background:repeating-linear-gradient(135deg,#C9CEDA 0 2px,#E8EBF1 2px 4px)}
.chart-card{margin-bottom:10px}
.ch-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch-head h4{margin:0;font-size:15.5px;font-weight:650}
.ch-head .best{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.readout{font-size:13px;color:var(--ink2);min-height:18px;margin-top:4px;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.chart details{margin-top:8px;font-size:13px;color:var(--muted)}
.chart table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
.chart td{padding:4px 2px;border-top:1px solid var(--line);color:var(--ink2)}
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.grid28 i{aspect-ratio:1;border-radius:7px;background:var(--soft)}
.grid28 i.on{background:var(--c)}
.grid28 i.today{outline:2px solid var(--ink);outline-offset:1px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;font-size:14px;z-index:100;transition:transform .25s ease;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function normalize(s){var b=blank();Object.keys(b).forEach(function(k){if(s[k]==null)s[k]=b[k]});return s}

function migrateOld(o){
  var s=blank(), dropped=0;
  s.logs=JSON.parse(JSON.stringify(o.logs||{}));
  s.notes=Object.assign({},o.notes||{});
  s.completedDays=Object.assign({},o.completedDays||{});
  s.tookClass=Object.assign({},o.tookClassLogs||{});
  s.circuit=JSON.parse(JSON.stringify(o.trainCircuitLogs||{}));
  s.recovery=JSON.parse(JSON.stringify(o.recoveryLogs||{}));
  Object.keys(o.sessionTimers||{}).forEach(function(k){
    var t=o.sessionTimers[k]||{}, el=t.elapsed||0;
    if(t.startedAt&&!t.stoppedAt)el+=Math.floor((Date.now()-t.startedAt)/1000);
    if(el>5400){dropped++;s.sessionTimers[k]={elapsed:0,startedAt:null,ended:true,dropped:true}}
    else if(el>0)s.sessionTimers[k]={elapsed:el,startedAt:null,ended:true};
  });
  Object.keys(o.cardioLogs||{}).forEach(function(k){
    var c=o.cardioLogs[k]||{},m=Math.round((c.seconds||0)/60);
    s.cardio[k]={modality:c.modality==='Rower'?'Erg':(c.modality||''),minutes:m||'',done:m>0};
  });
  if(o.reminderDismissed)s.reminderDismissed=o.reminderDismissed;
  return {s:s,dropped:dropped};
}
function mergeInto(dst,src){
  ['logs','notes','completedDays','sessionTimers','tookClass','circuit','recovery','cardio','checks','rating','body','blockOverrides'].forEach(function(k){
    dst[k]=Object.assign({},dst[k]||{},src[k]||{});

}
function loadState(){
  var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){try{return {s:normalize(JSON.parse(raw))}}catch(e){}}
  var old=null;try{old=JSON.parse(localStorage.getItem(OLD_KEY)||'null')}catch(e){}
  if(old&&old.logs){var m=migrateOld(old);return {s:m.s,migrated:m}}
  return {s:blank()};
}

// Old app sometimes saved DB bench as barbell bench (no substitute picked). Barbell sets were all 195+,
// so any old bench entry with every weight under 120 lb is relabeled as DB bench. Safe to run repeatedly.
function fixLegacy(st){
  Object.keys(st.logs||{}).forEach(function(k){
    if(k>=SWAP_DATE)return;var e=st.logs[k].bp;if(!e||e.selectedSub)return;
    var ws=Object.keys(e.sets||{}).map(function(i){return parseFloat(e.sets[i].weight)}).filter(function(w){return w>0});
    if(ws.length&&ws.every(function(w){return w<120}))e.selectedSub='DB Bench Press';
  });
}

function autoBlock(mon){
  var w=Math.round((mon-parse(state.cycleStart))/(7*DAY_MS));
  if(w<0)return null;
  if(w<CYCLE1.length)return CYCLE1[w];
  return CYCLE[(w-CYCLE1.length)%CYCLE.length];
}
function blockOf(d){var mon=mondayOf(d);return state.blockOverrides[dk(mon)]||autoBlock(mon)}
function blockWeek(d){
  var b=blockOf(d);if(!b)return null;
  if(b==='deload')return {b:b,n:1,of:1};
  var n=0,m=mondayOf(d);
  for(var i=0;i<60;i++){var x=blockOf(m);if(x===b)n++;else if(x!=='deload')break;m=addDays(m,-7)}
  var of=n;var f=addDays(mondayOf(d),7);
  for(var j=0;j<60;j++){var y=blockOf(f);if(y===b)of++;else if(y!=='deload')break;f=addDays(f,7)}
  return {b:b,n:n,of:of};
}
function blockKey(b){return b==='strength'?'s':b==='endurance'?'e':'b'}

function setsStr(sets){

    return s.weight&&s.reps?s.weight+' × '+s.reps:s.weight?s.weight+' lb':s.reps;
  }).join(', ');

var sortedKeysCache=null;

function lastTime(k,ex,sub){
  var srcs=[{id:ex.id,any:true}].concat(ex.legacy||[]);
  var keys=logKeys();
  for(var i=0;i<keys.length;i++){
    if(keys[i]>=k)continue;
    var day=state.logs[keys[i]];
    for(var j=0;j<srcs.length;j++){
      var e=day[srcs[j].id];if(!e)continue;
      var es=e.selectedSub||null;
      if(srcs[j].any){if(es!==(sub||null))continue}else if(es!==srcs[j].sub||sub)continue;
      var s=setsStr(e.sets);if(s)return {k:keys[i],s:s,sets:e.sets||{}};

}
function e1(w,r){w=parseFloat(w);r=parseFloat(r);if(!(w>0)||!(r>0))return 0;return w*(1+Math.min(r,15)/30)}
function priorBest(k,ex,sub){
  var srcs=[{id:ex.id,any:true}].concat(ex.legacy||[]),best=0;
  logKeys().forEach(function(dkey){
    if(dkey>=k)return;var day=state.logs[dkey];
    srcs.forEach(function(src){
      var e=day[src.id];if(!e)return;var es=e.selectedSub||null;
      if(src.any){if(es!==(sub||null))return}else if(es!==src.sub||sub)return;
      Object.keys(e.sets||{}).forEach(function(i){var v=e1(e.sets[i].weight,e.sets[i].reps);if(v>best)best=v});
    });
  });

}

}

function legacyTitle(d){var t=dayType(d);if(t==='sunday')return isLegacy(d)?'Rest':'Long Zone 2';return DAYS[t].title}

function dayStats(k){
  var lg=state.logs[k]||{},sets=0;
  Object.keys(lg).forEach(function(id){var s=lg[id].sets||{};Object.keys(s).forEach(function(i){if(s[i].done)sets++})});
  var tm=state.sessionTimers[k]||{},sec=tm.dropped?0:timerSecs(tm);
  var c=state.cardio[k]||{};
  var parts=[];
  if(sets)parts.push(sets+' sets');
  if(state.tookClass[k])parts.push('Took class');
  if(sec>0&&sec<=5400)parts.push(Math.round(sec/60)+' min');
  if(state.rating[k])parts.push('Felt '+state.rating[k]+'/5');
  if(state.body[k]&&state.body[k].weight)parts.push(state.body[k].weight+' lb');
  if(c.done&&c.minutes)parts.push(c.minutes+' min '+modName(c).toLowerCase());
  else if(c.done)parts.push('Cardio done');
  return parts.join(', ');
}
function historyKeys(){

  Object.keys(state.notes).forEach(function(k){if(state.notes[k]&&state.notes[k].trim())set[k]=1});
  Object.keys(state.logs).forEach(function(k){var l=state.logs[k];if(Object.keys(l).some(function(id){var s=l[id].sets||{};return Object.keys(s).some(function(i){return s[i].done})}))set[k]=1});
  Object.keys(state.cardio).forEach(function(k){if(state.cardio[k].done)set[k]=1});
  Object.keys(state.body).forEach(function(k){if(state.body[k].weight)set[k]=1});
  var today=dk(new Date());

}

function chartData(ch){
  var pts=[];
  if(ch.body){Object.keys(state.body).sort().forEach(function(k){var w=parseFloat(state.body[k].weight);if(w>0)pts.push({k:k,v:w})});return pts.slice(-26)}
  Object.keys(state.logs).sort().forEach(function(k){
    var day=state.logs[k],best=0;
    ch.src.forEach(function(s){
      var e=day[s.id];if(!e)return;
      if((e.selectedSub||null)!==s.sub)return;
      Object.keys(e.sets||{}).forEach(function(i){var st=e.sets[i];var w=parseFloat(st.weight);if(w>0&&(st.done||st.reps)&&w>best)best=w});
    });
    if(best>0)pts.push({k:k,v:best});
  });
  return pts.slice(-16);
}
function renderChart(ch,ci){
  var pts=chartData(ch),c=DAYS[ch.day].c,unit=ch.unit||'lb';
  var h='<div class="card chart-card chart"><div class="ch-head"><h4>'+esc(ch.name)+'</h4>';
  if(pts.length<2){return h+'</div><div class="readout">'+(ch.body?'Log two Sunday weigh-ins to see your trend.':'Log this lift twice to see your trend.')+'</div></div>'}
  var best=pts.reduce(function(a,p){return p.v>a.v?p:a},pts[0]),last=pts[pts.length-1];
  if(ch.body){var dlt=Math.round((last.v-pts[0].v)*10)/10;h+='<span class="best">'+(dlt>0?'+':'')+dlt+' lb since '+esc(fmt(parse(pts[0].k),{month:'short',day:'numeric'}))+'</span></div>'}
  else h+='<span class="best">Best '+best.v+' '+esc(unit)+'</span></div>';
  h+='<div class="readout" id="ro'+ci+'">Latest '+esc(fmt(parse(last.k),{month:'short',day:'numeric'}))+': '+last.v+' '+esc(unit)+'</div>';
  var W=320,H=130,pl=34,pr=10,pt=10,pb=22;
  var vs=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  var step=niceStep((mx-mn)||mx*0.2||10);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;if(mx===mn)mx=mn+step;
  function X(i){return pl+(W-pl-pr)*(pts.length===1?0.5:i/(pts.length-1))}
  function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn))}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(ch.name)+' best weight per session">';
  for(var g=mn;g<=mx+0.001;g+=step){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#E2E6EE" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-size="10.5" fill="#737A90">'+Math.round(g)+'</text>'}
  s+='<polyline fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p,i){return X(i)+','+Y(p.v)}).join(' ')+'"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4" fill="'+c+'" stroke="#fff" stroke-width="2"/>';
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="15" fill="transparent" data-act="pt" data-c="'+ci+'" data-i="'+i+'" style="cursor:pointer"><title>'+esc(fmt(parse(p.k),{month:'short',day:'numeric'}))+': '+p.v+'</title></circle>';
  });
  s+='<text x="'+pl+'" y="'+(H-4)+'" font-size="10.5" fill="#737A90">'+esc(fmt(parse(pts[0].k),{month:'short',day:'numeric'}))+'</text><text x="'+(W-pr)+'" y="'+(H-4)+'" text-anchor="end" font-size="10.5" fill="#737A90">'+esc(fmt(parse(last.k),{month:'short',day:'numeric'}))+'</text></svg>';
  h+=s+'<details><summary>Show as table</summary><table>'+pts.slice().reverse().map(function(p){return '<tr><td>'+esc(fmt(parse(p.k),{month:'short',day:'numeric',year:'numeric'}))+'</td><td style="text-align:right">'+p.v+' '+esc(unit)+'</td></tr>'}).join('')+'</table></details></div>';
  return h;
}
function niceStep(r){var raw=r/3,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

  var a=t.dataset.act,k=dk(sel),id=t.dataset.id;
  switch(a){
    case 'tab':view=t.dataset.v;window.scrollTo(0,0);render();break;
    case 'day':sel=parse(t.dataset.k);view='today';render();break;
    case 'wk':sel=addDays(sel,7*Number(t.dataset.dir));render();break;
    case 'ex':var lg=E(k,id);lg.open=!lg.open;save();var c=document.getElementById('ex-'+id);c.classList.toggle('open',lg.open);t.setAttribute('aria-expanded',lg.open);break;
    case 'sub':E(k,id).selectedSub=t.dataset.sub||null;save();rerenderEx(id);break;
    case 'done':
      var lg2=E(k,id);lg2.sets=lg2.sets||{};var n=t.dataset.n;lg2.sets[n]=lg2.sets[n]||{};
      lg2.sets[n].done=!lg2.sets[n].done;save();sortedKeysCache=null;
      t.classList.toggle('on',lg2.sets[n].done);t.setAttribute('aria-pressed',lg2.sets[n].done);
      var card=document.getElementById('ex-'+id);card.classList.toggle('logged',Object.keys(lg2.sets).some(function(i){return lg2.sets[i].done}));
      updateRing();break;
    case 'stretch':var ls=E(k,id);ls.stretchDone=!ls.stretchDone;save();t.classList.toggle('on',ls.stretchDone);updateRing();break;
    case 'timer':
      var tm=state.sessionTimers[k]||(state.sessionTimers[k]={elapsed:0,startedAt:null});
      if(tm.startedAt){tm.elapsed=timerSecs(tm);tm.startedAt=null}else{tm.startedAt=Date.now();if(!tm.firstStart)tm.firstStart=new Date().toISOString()}
      save();render();break;
    case 'finish':
      var tf=state.sessionTimers[k]||{};tf.elapsed=timerSecs(tf);tf.startedAt=null;tf.ended=true;tf.endedAt=new Date().toISOString();state.sessionTimers[k]=tf;state.completedDays[k]=true;save();render();toast('Session saved');break;
    case 'complete':state.completedDays[k]=!state.completedDays[k];save();render();break;
    case 'took':state.tookClass[k]=!state.tookClass[k];if(state.tookClass[k])state.completedDays[k]=true;save();render();break;
    case 'station':var cs=state.circuit[k]||(state.circuit[k]={});cs[id]=!cs[id];save();t.classList.toggle('on',cs[id]);updateRing();break;
    case 'check':var ck=state.checks[k]||(state.checks[k]={});ck[id]=!ck[id];save();t.classList.toggle('on',ck[id]);updateRing();break;
    case 'rec':var rc=state.recovery[k]||(state.recovery[k]={});rc[id]=!rc[id];save();t.classList.toggle('on',rc[id]);break;
    case 'mod':var cm=state.cardio[k]||(state.cardio[k]={});cm.modality=t.dataset.m;save();render();break;
    case 'iv':var ci=state.cardio[k]||(state.cardio[k]={});ci.iv=ci.iv||[];ci.iv[t.dataset.n]=!ci.iv[t.dataset.n];save();t.classList.toggle('on',!!ci.iv[t.dataset.n]);break;
    case 'cdone':
      var cc=state.cardio[k]||(state.cardio[k]={});cc.done=!cc.done;
      if(!cc.modality)cc.modality=(CARDIO[sel.getDay()]||{mods:['']}).mods[0];
      if(cc.done&&dayType(sel)==='sunday')state.completedDays[k]=true;
      save();render();break;
    case 'settings':openSettings();break;
    case 'closeSheet':closeSheet();break;
    case 'setBlock':var mk=dk(mondayOf(sel));if(t.dataset.b)state.blockOverrides[mk]=t.dataset.b;else delete state.blockOverrides[mk];save();closeSheet();render();break;
    case 'exportBackup':exportData();render();break;
    case 'dismissBackup':state.reminderDismissed=dk(new Date());save();render();break;
    case 'import':document.getElementById('importFile').click();break;
    case 'reimportOld':try{var msg=importObj(JSON.parse(localStorage.getItem(OLD_KEY)));closeSheet();render();toast(msg||'Nothing to import')}catch(err){toast('Could not read the old app data')}break;
    case 'hist':openHistory(t.dataset.k);break;
    case 'openDay':closeSheet();sel=parse(t.dataset.k);view='today';window.scrollTo(0,0);render();break;
    case 'rate':var rn=Number(t.dataset.n);state.rating[k]=state.rating[k]===rn?0:rn;save();document.querySelectorAll('.rb').forEach(function(b){var on=Number(b.dataset.n)===state.rating[k];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});break;
    case 'dismissNudge':state.importNudgeDismissed=true;save();render();break;
    case 'hf':histFilter=t.dataset.f;renderHistList();document.querySelectorAll('[data-act=hf]').forEach(function(p){p.classList.toggle('on',p===t)});break;
    case 'shareNotes':shareNotes();break;
    case 'more':histLimit+=40;renderHistList();break;
    case 'pt':
      var ch=CHARTS[t.dataset.c],p=chartData(ch)[t.dataset.i];
      var ro=document.getElementById('ro'+t.dataset.c);if(ro&&p)ro.textContent=fmt(parse(p.k),{month:'short',day:'numeric',year:'numeric'})+': '+p.v+' '+(ch.unit||'lb');break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target,c=t.dataset.chg;if(!c)return;
  var k=dk(sel),id=t.dataset.id,v=t.value;
  if(c==='w'||c==='r'){
    var lg=E(k,id);lg.sets=lg.sets||{};var n=t.dataset.n;lg.sets[n]=lg.sets[n]||{};
    lg.sets[n][c==='w'?'weight':'reps']=v;save();sortedKeysCache=null;updatePR(id);
  }else if(c==='note'){state.notes[k]=v;save()}
  else if(c==='bw'||c==='waist'){var bb=state.body[k]||(state.body[k]={});bb[c==='bw'?'weight':'waist']=v;save()}
  else if(c==='cmin'||c==='cdist'||c==='chr'||c==='cother'){var cd=state.cardio[k]||(state.cardio[k]={});cd[{cmin:'minutes',cdist:'distance',chr:'hr',cother:'other'}[c]]=v;save()}
  else if(c==='tmin'){var tm=state.sessionTimers[k]||(state.sessionTimers[k]={ended:true});tm.elapsed=Math.max(0,parseInt(v)||0)*60;tm.dropped=false;tm.startedAt=null;tm.ended=true;save()}
  else if(c==='cycleStart'&&v){state.cycleStart=dk(mondayOf(parse(v)));save();closeSheet();render();toast('Program start set to '+fmt(parse(state.cycleStart),{month:'short',day:'numeric'}))}
});
var hqT;
document.addEventListener('input',function(e){if(e.target.id==='histQ'){histQuery=e.target.value;clearTimeout(hqT);hqT=setTimeout(renderHistList,200)}});
document.getElementById('importFile').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var msg=importObj(JSON.parse(r.result));closeSheet();render();toast(msg||'That file does not look like a training backup')}catch(err){toast('That file is not valid JSON')}};
  r.readAsText(f);this.value='';
});

// timer tick, with a safety stop for timers left running
setInterval(function(){
  if(view!=='today')return;
  var k=dk(sel),tm=state.sessionTimers[k];if(!tm||!tm.startedAt)return;
  var s=timerSecs(tm);
  if(s>3*3600){tm.startedAt=null;tm.elapsed=0;tm.ended=true;tm.dropped=true;save();render();toast('Timer ran over 3 hours, so it was stopped. Enter your time.');return}
  var el=document.getElementById('timerT');if(el)el.textContent=clock(s);
},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&view==='today')render()});

render();
if(loaded.migrated)setTimeout(function(){toast('Brought over '+Object.keys(state.logs).length+' days from your old app')},400);
</script>
</body>
</html>
